# Gait Def
# Low-crawl gait for height-bar passages (body height = 0.10m)
# Alternating diagonal pairs: FR+RL -> FL+RR -> FR+RL -> ...

[[section]]
contact  = [1, 1, 1, 1]
duration = 5

[[section]]
contact  = [1, 0, 0, 1]
duration = 5

[[section]]
contact  = [0, 0, 0, 0]
duration = 5

[[section]]
contact  = [0, 1, 1, 0]
duration = 5

[[section]]
contact  = [0, 0, 0, 0]
duration = 5

[[section]]
contact  = [1, 1, 1, 1]
duration = 5
